spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/print-approval-system}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
app.admin.password=${ADMIN_PASSWORD}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.accesslog.enabled=false
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=6MB
server.max-http-request-header-size=8KB
server.tomcat.threads.max=32
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.servlet.session.timeout=20m
spring.datasource.hikari.maximum-pool-size=8
app.storage.max-bytes=${STORAGE_MAX_BYTES:1073741824}
app.storage.max-jobs=${STORAGE_MAX_JOBS:5000}
app.storage.max-versions=${STORAGE_MAX_VERSIONS:20000}
